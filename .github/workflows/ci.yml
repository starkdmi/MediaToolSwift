name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      extended_media:
        description: Run the extended media suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  swift5-language-mode:
    name: Swift 5 language mode (oldest Xcode)
    # Deployment targets in Package.swift are what determine device support;
    # this lane covers the oldest *toolchain* a consumer may integrate with.
    #
    # Xcode 15.2 (Swift 5.9) shipped only on the macOS 13 and macOS 14 images,
    # both of which GitHub has retired, so the oldest toolchain reachable on a
    # supported runner is Xcode 16. `swift-tools-version: 6.0` in Package.swift
    # sets Xcode 16 as the hard floor for resolving the package at all; this
    # lane additionally proves consumers still pinned to the Swift 5 language
    # mode can build against it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (oldest available)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build and test
        run: swift test -Xswiftc -swift-version -Xswiftc 5

  macos:
    name: macOS required suite (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compatibility floor: the oldest Swift 6 toolchain still supported.
          - xcode: "16.2"
            gates: false
          # What consumers actually build with today. Without this lane a newer
          # compiler's diagnostics can break their builds while CI stays green,
          # because every build here uses -warnings-as-errors.
          #
          # `gates` marks the lane that also runs the checks which need to run
          # exactly once. They live here because Swift 6.0's api-digester dumps
          # no symbols for this package and then reports every public
          # declaration as removed, which no allowlist can tell apart from a
          # real removal.
          - xcode: "26.3"
            gates: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Swift 6 strict-concurrency build and test
        run: >-
          swift test
          -Xswiftc -swift-version -Xswiftc 6
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      # Both gates below filter their output through
      # .github/expected-api-breakages.txt. Intentional breaks are declared
      # there once, in the commit that makes them; everything else fails.
      #
      # Note that the digester does not see every source break. Adding
      # `@Sendable` to a public closure payload, for example, is reported by
      # neither gate but does break clients, so it still needs a ClientTests
      # case and a release note.
      - name: API compatibility with 1.2.0
        if: matrix.gates
        run: .github/scripts/check-api-breakage.sh 1.2.0

      - name: API compatibility with pull-request base
        if: matrix.gates && github.event_name == 'pull_request'
        run: >-
          .github/scripts/check-api-breakage.sh
          "${{ github.event.pull_request.base.sha }}"

      - name: Whitespace check
        if: matrix.gates
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

      - name: Install SwiftLint
        if: matrix.gates
        run: command -v swiftlint || brew install swiftlint

      - name: SwiftLint
        if: matrix.gates
        run: swiftlint lint --no-cache

      - name: Build DocC documentation
        if: matrix.gates
        run: >-
          swift package --allow-writing-to-directory "$RUNNER_TEMP/docc"
          generate-documentation --target MediaToolSwift --disable-indexing
          --output-path "$RUNNER_TEMP/docc"

  # Guards the deployment targets declared in Package.swift. Each triple pins
  # the oldest supported OS explicitly, so raising a minimum by accident fails
  # here rather than silently dropping devices.
  deployment-targets:
    name: ${{ matrix.platform }} build (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.2", "26.3"]
        # `platform` has to stay a real axis. Each `include` entry below then
        # matches the combinations naming its platform and only fills in the
        # missing metadata. As include-only entries they would instead merge
        # into the `xcode` combinations and overwrite one another, collapsing
        # the cross-product to a single platform.
        platform: ["iOS", "tvOS", "Mac Catalyst", "visionOS"]
        include:
          - platform: iOS
            triple: arm64-apple-ios15.0
            sdk: iphoneos
            destination: generic/platform=iOS
          - platform: tvOS
            triple: arm64-apple-tvos15.0
            sdk: appletvos
            destination: generic/platform=tvOS
          - platform: Mac Catalyst
            triple: arm64-apple-ios15.0-macabi
            sdk: macosx
          # No `destination` here: visionOS 1.0 predates none of the APIs the
          # tests use, and the visionOS platform is not always installed
          # alongside its SDK, which would fail the step environmentally.
          - platform: visionOS
            triple: arm64-apple-xros1.0
            sdk: xros
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Build library
        shell: bash
        run: |
          sdk_path="$(xcrun --sdk "${{ matrix.sdk }}" --show-sdk-path)"
          swift build --triple "${{ matrix.triple }}" \
            -Xswiftc -sdk -Xswiftc "$sdk_path" \
            -Xcc -isysroot -Xcc "$sdk_path" \
            -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
      # `swift build` compiles only the library, so test-target code that uses
      # APIs newer than the deployment target slipped through unnoticed. Compile
      # the tests for each platform as well.
      #
      # Only on the newest Xcode: the macOS 15 image keeps the iOS and tvOS SDKs
      # for Xcode 16.2 (the `swift build` step above uses them) but not those
      # platforms themselves, so `xcodebuild` finds no matching destination
      # there. The deployment targets are still guarded on both toolchains by
      # the library build.
      - name: Build tests
        if: matrix.destination != '' && matrix.xcode == '26.3'
        run: >-
          xcodebuild build-for-testing
          -scheme MediaToolSwift
          -destination '${{ matrix.destination }}'
          -quiet

  cocoapods:
    name: CocoaPods
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The podspec declares iOS and tvOS, and lint builds every declared
      # platform. Xcode 16.2 on this image has no iOS or tvOS platform
      # installed, so lint cannot resolve their destinations.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Validate release tag and podspec version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          spec_version="$(ruby -e 'text = File.read("MediaToolSwift.podspec"); abort unless text =~ /spec\.version\s*=\s*"([^"]+)"/; puts Regexp.last_match(1)')"
          test "$GITHUB_REF_NAME" = "$spec_version"
          grep -Fq ':tag => "#{spec.version}"' MediaToolSwift.podspec
      - name: Install CocoaPods
        run: command -v pod || gem install cocoapods -v 1.16.2 --no-document
      - name: Lint checkout
        if: github.ref_type != 'tag'
        run: pod lib lint MediaToolSwift.podspec --allow-warnings
      - name: Lint tagged source artifact
        if: github.ref_type == 'tag'
        run: pod spec lint MediaToolSwift.podspec --allow-warnings

  # The example app is a real consumer of the public API and the only place a
  # source-breaking change shows up as a compile error rather than a silent
  # allowlist entry. Without this lane it drifted out of date unnoticed.
  example-app:
    name: Example app (${{ matrix.destination }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # One target, one shared scheme, two destinations. The project sets
        # `SDKROOT = auto`, so the same scheme builds both. A separate
        # `MediaToolSwiftExampleMacOS` scheme exists only in a local
        # `xcuserdata` directory, which is not committed, so naming it here
        # would pass locally and fail on every fresh checkout.
        destination: ["platform=macOS", "generic/platform=iOS"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      # The target uses automatic signing with a development team and an
      # entitlements file. A hosted runner has neither a certificate nor a
      # provisioning profile, so signing has to be off for the build to reach
      # the API-drift check this lane exists for.
      - run: >-
          xcodebuild build
          -project Example/MediaToolSwiftExample.xcodeproj
          -scheme MediaToolSwiftExample
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO
          -quiet

  thread-sanitizer:
    name: Thread Sanitizer cancellation stress
    runs-on: macos-15
    env:
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - run: >-
          swift test --sanitize=thread
          --filter 'RefactoringVerificationTests/.*Cancellation'

  extended-media:
    name: Extended media suite
    if: github.event_name != 'workflow_dispatch' || inputs.extended_media
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - run: MEDIATOOLSWIFT_EXTENDED_MEDIA=1 swift test
